<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A82C55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plantão & Extras">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Plantão & Extras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de bolso — cabeçalho com traçado de ECG, conteúdo em coluna única (máx. 560px), barra de abas fixa embaixo, formulários em folha deslizante. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EEEC; --ink:#142729; --muted:#5A6E70; --line:#D9E2E0;
  --accent:#A82C55; --accent-ink:#FFFFFF; --accent-soft:#F6E1E8;
  --teal:#1C6B66; --teal-soft:#DCEEEB;
  --gold:#9A6A12; --gold-soft:#F8EDD6;
  --ok:#2C7A4B; --ok-soft:#DDF0E3;
  --warn:#A55B00; --warn-soft:#FBEBD3;
  --violet:#5E4DB2; --violet-soft:#E9E5FA;
  --shadow:0 1px 2px rgba(20,39,41,.06),0 8px 24px rgba(20,39,41,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E191A; --surface:#162425; --sunk:#1D2E30; --ink:#E4EEED; --muted:#93A8A9; --line:#27393B;
  --accent:#EE7C9F; --accent-ink:#2A0E18; --accent-soft:#3A1D28;
  --teal:#5BC1B7; --teal-soft:#16332F;
  --gold:#E2B45E; --gold-soft:#342913;
  --ok:#6FCB91; --ok-soft:#163323;
  --warn:#EFB15A; --warn-soft:#382912;
  --violet:#AFA2F2; --violet-soft:#27223F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E191A; --surface:#162425; --sunk:#1D2E30; --ink:#E4EEED; --muted:#93A8A9; --line:#27393B;
  --accent:#EE7C9F; --accent-ink:#2A0E18; --accent-soft:#3A1D28;
  --teal:#5BC1B7; --teal-soft:#16332F;
  --gold:#E2B45E; --gold-soft:#342913;
  --ok:#6FCB91; --ok-soft:#163323;
  --warn:#EFB15A; --warn-soft:#382912;
  --violet:#AFA2F2; --violet-soft:#27223F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;flex-direction:column;min-width:0}
.hello small{color:var(--muted);font-size:12.5px}
.hello h1{margin:0;font-family:var(--f-display);font-weight:650;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.ecg{display:block;width:100%;height:18px;color:var(--accent);opacity:.55}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--ok)}
.sync.local i{background:var(--warn)}
.month{display:flex;align-items:center;gap:8px}
.month b{font-family:var(--f-display);font-weight:600;font-size:16px;min-width:7.6em;text-align:center}
.month button{border:0;background:var(--sunk);border-radius:10px;width:34px;height:32px;display:grid;place-items:center}
.month button svg{width:18px;height:18px}

main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:16px}

/* Cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2,.sec-title{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.005em}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-head a,.link{color:var(--teal);font-weight:600;font-size:13.5px;background:none;border:0;padding:0;text-decoration:none}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

/* Herói financeiro */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,10vw,44px);letter-spacing:-.025em;line-height:1}
.hero .sub{color:var(--muted);font-size:13.5px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.bar span{display:block;height:100%}
.c-fixo{background:var(--teal)} .c-sob{background:var(--gold)} .c-cham{background:var(--warn)} .c-plan{background:var(--violet)} .c-com{background:var(--accent)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px}
.rows .lbl{display:flex;flex-direction:column;min-width:0}
.rows .lbl small{color:var(--muted);font-size:12.5px}
.rows .v{font-weight:600}
.net{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14px}

.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);text-align:left;width:100%}
.alert svg{flex:none;width:20px;height:20px;color:var(--warn);margin-top:1px}
.alert b{display:block}
.alert small{color:var(--muted)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600}
.qbtn small{font-weight:400;color:var(--muted);font-size:12.5px}
.qbtn .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.qbtn .ic svg{width:18px;height:18px}
.qbtn.a .ic{background:var(--accent-soft);color:var(--accent)}
.qbtn.b .ic{background:var(--gold-soft);color:var(--gold)}

.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left}
.dbadge{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--gold-soft);color:var(--gold);padding:4px 0;line-height:1.1}
.dbadge b{display:block;font-family:var(--f-display);font-size:19px}
.dbadge small{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.plist .t{display:flex;flex-direction:column;min-width:0;flex:1}
.plist .t small{color:var(--muted);font-size:12.5px}

.months{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:18px}
.months div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.months .col{width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--teal-soft);position:relative}
.months .col.cur{background:var(--accent)}
.months .col em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;margin-bottom:3px}
.months small{font-size:12px;color:var(--muted);text-transform:capitalize}

/* Extras */
.toolbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:11px 0;width:100%;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.sumline b{font-family:var(--f-display);font-size:20px}
.daygroup{display:flex;flex-direction:column;gap:8px}
.daygroup h3{margin:6px 0 0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px}
.tag.zero{color:var(--teal);background:var(--teal-soft)}
.ex-top .val{font-weight:700;white-space:nowrap}
.ex-mid{font-size:15px;overflow-wrap:anywhere}
.ex-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.reg{border:1px dashed var(--warn);color:var(--warn);background:transparent;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.reg.on{border:1px solid transparent;background:var(--ok-soft);color:var(--ok)}

/* Rotina */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase;padding-bottom:4px}
.cal button{aspect-ratio:1/1.05;max-width:100%;border:1px solid transparent;background:var(--bg);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0 0;gap:3px;font-variant-numeric:tabular-nums;font-weight:500;min-width:0}
.cal button.today{border-color:var(--teal)}
.cal button.sob{background:var(--gold-soft)}
.cal button.sel{background:var(--ink);color:var(--bg)}
.cal .marks{display:flex;gap:3px;height:6px}
.cal .marks i{width:6px;height:6px;border-radius:50%}
.m-sob{background:var(--gold)} .m-cham{background:var(--warn)} .m-ex{background:var(--accent)} .m-it{background:var(--teal)} .m-plan{background:var(--violet)}
.cal button.sel .marks i{outline:1.5px solid var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle .lbl{display:flex;flex-direction:column;min-width:0}
.toggle small{color:var(--muted);font-size:12.5px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+span{background:var(--gold)}
.sw.w input:checked+span{background:var(--warn)}
.sw.v input:checked+span{background:var(--violet)}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.stepper b{min-width:2.2em;text-align:center;font-size:17px}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled+span{opacity:.45}
.daytotal{display:flex;justify-content:space-between;font-size:14px;padding-top:10px;border-top:1px solid var(--line)}
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.agenda li button{width:100%;display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.agenda .hr{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.25}
.agenda .hr small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.agenda .t{min-width:0;overflow-wrap:anywhere}
.agenda .k{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.k-plantao{color:var(--gold)} .k-cirurgia{color:var(--accent)} .k-consulta,.k-exame{color:var(--teal)} .k-pessoal,.k-outro{color:var(--muted)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;resize:vertical}

/* Contrato */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.facts small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.facts b{font-size:14px;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.clist li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.clist li:first-child{border-top:0}
.clist p{margin:0}
.clist p b{display:block;margin-bottom:2px}
.cl{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 6px;white-space:nowrap}
.intro{font-size:14px;color:var(--muted);margin:0}
.box-d{border-left:3px solid var(--ok)} .box-o{border-left:3px solid var(--teal)} .box-n{border-left:3px solid var(--gold)} .box-a{border-left:3px solid var(--warn)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
td.r,th.r{text-align:right;white-space:nowrap}
.disc{font-size:12.5px;color:var(--muted);margin:0}

/* Ajustes */
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px 12px;font-weight:400;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.btn.danger.armed{background:var(--warn);color:var(--surface)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--teal);font-weight:600;padding:0}
.back svg{width:18px;height:18px}

/* Barra de abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:6px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;padding:14px 18px;font-weight:700;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:20px;height:20px}

/* Folha (formulários) */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(8,18,19,.45)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 0 calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet-panel .wrap{display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 6px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:650;font-size:21px}
.tchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tchip{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 10px;text-align:left;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:2px;min-width:0}
.tchip small{font-weight:500;color:var(--muted);font-size:12px}
.tchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tchip[aria-pressed="true"] small{color:var(--accent)}
.hint{margin:0;font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:9px 12px}
.hint.warn{background:var(--gold-soft);color:var(--ink)}
.hint button{margin-top:6px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.calc{font-size:12.5px;color:var(--muted);font-weight:400}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}.sw span,.sw span::after{transition:none}}

/* Bíblia */
.pbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--teal);border-radius:99px}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bstats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;min-width:0;text-align:center}
.bstats b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.2}
.bstats small{color:var(--muted);font-size:11.5px}
.trow{display:flex;flex-direction:column;gap:6px}
.trow-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px}
.trow-top span{color:var(--muted)}
.next{display:flex;flex-direction:column;gap:12px}
.next .t{display:flex;flex-direction:column;min-width:0}
.next .t b{font-family:var(--f-display);font-size:19px;font-weight:600}
.books{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.books li button{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.books li:first-child button{border-top:0}
.books .pbar{grid-column:1/-1;height:5px}
.books .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.books .done .cnt{color:var(--teal);font-weight:600}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.caps button{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.caps button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.bnav{display:flex;justify-content:space-between;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.backup-box textarea{font-family:var(--f-mono);font-size:11px;min-height:140px}
@media (min-width:600px){ .tchips{grid-template-columns:1fr 1fr 1fr} }
</style>

function normSettings(s){ const o = {...structuredClone(DEFAULTS), ...(s||{})}; o.tabela = {...DEFAULTS.tabela, ...((s&&s.tabela)||{})}; delete o.kind; return o; }
// biblia.lidos: { 'gn:1': 'YYYY-MM-DD' } — capítulo lido → data em que foi marcado

/* Nuvem: dentro de um Artifact do claude.ai usa window.claude 'db'; fora dele (GitHub Pages) usa Firebase
   com login por e-mail e senha. Coleção users/{uid}/docs — as regras do Firestore só deixam a dona ler e gravar. */
const FIREBASE = { apiKey:'AIzaSyAQD2UnzV5aJ1GJd7sfcB2GOxWgBQ-NuwA', authDomain:'plantao-extras-sara.firebaseapp.com', projectId:'plantao-extras-sara', appId:'1:440303658125:web:f60ace67576e55a084aec4' };
const SYNC_KEY = 'sara-trabalho-sync-uid'; // última conta já mesclada neste aparelho
let cloud = null; let cloudKind = null; let mode = 'connecting'; let fbAuth = null; let fbUnsub = null;
const queues = {};
function setMode(m){ mode=m; const el=$('#sync');
  el.className = 'sync ' + (m==='cloud'?'cloud':m==='local'?'local':'');
  el.querySelector('span').textContent = m==='cloud' ? (cloudKind==='fb' ? 'Sincronizado' : 'Salvo na conta') : m==='local' ? (window.claude ? 'Só neste aparelho' : 'Salvo no aparelho') : 'Conectando…';
}
function writeDoc(docId, body){
  if(!cloud) return Promise.resolve();
  const run = ()=> body===null ? cloud.doc(docId).delete() : cloud.doc(docId).set(body);
  const onErr = e=>{ if(e && ['invalid_argument','revoked','not_granted','permission-denied','unauthenticated'].includes(e.code)){ cloud=null; setMode('local'); toast('Sem permissão para salvar na nuvem: guardando neste aparelho'); } };
  // O Firestore já ordena as gravações e guarda as pendentes sem internet; não encadear para nada ficar fora do cache dele
  if(cloudKind==='fb') return run().catch(onErr);
  const prev = queues[docId] || Promise.resolve();
  const p = prev.then(run).catch(onErr);
  queues[docId] = p; return p;
}
const dayDocId = d => 'd_'+d, exDocId = id => 'x_'+id;
const hasLocalData = () => Object.keys(state.extras).length || Object.keys(state.days).length || Object.keys(state.biblia.lidos).length;
async function uploadAll(){
  await writeDoc('settings', {kind:'settings', ...state.settings});
  for(const e of Object.values(state.extras)) await writeDoc(exDocId(e.id), {kind:'extra', ...e});
  for(const d of Object.values(state.days)) await writeDoc(dayDocId(d.date), {kind:'day', ...d});
  if(Object.keys(state.biblia.lidos).length) await writeDoc('biblia', {kind:'biblia', lidos: state.biblia.lidos});
}
// Primeira conexão de uma conta neste aparelho: sobe o que só existe aqui (a nuvem vence nos conflitos)
async function mergeUp(first){
  if(first.empty){ if(hasLocalData()) await uploadAll(); return; }
  const ids = new Set(first.docs.map(d=>d.id));
  for(const e of Object.values(state.extras)) if(!ids.has(exDocId(e.id))) await writeDoc(exDocId(e.id), {kind:'extra', ...e});
  for(const d of Object.values(state.days)) if(!ids.has(dayDocId(d.date))) await writeDoc(dayDocId(d.date), {kind:'day', ...d});
  if(Object.keys(state.biblia.lidos).length){ const cb = first.docs.find(d=>d.id==='biblia');
    await writeDoc('biblia', {kind:'biblia', lidos: {...state.biblia.lidos, ...(cb ? normBiblia(cb.data()).lidos : {})}}); }
}
function applySnapshot(snap){
  const next = { settings: structuredClone(DEFAULTS), extras:{}, days:{}, biblia:{lidos:{}} };
  for(const doc of snap.docs){ const d = doc.data(); if(!d) continue;
    if(d.kind==='settings') next.settings = normSettings(d);
    else if(d.kind==='biblia') next.biblia = normBiblia(d);
    else if(d.kind==='extra' && d.id) next.extras[d.id] = {...d};
    else if(d.kind==='day' && d.date) next.days[d.date] = {...d, itens: Array.isArray(d.itens)? d.itens.map(x=>({...x})) : []};
  }
  state = next; saveLocal(); render();
}
async function connectCol(col, kind, accountId){
  cloudKind = kind; setMode('connecting');
  const first = await col.get();
  cloud = col;
  let jaMesclado = false; try{ jaMesclado = localStorage.getItem(SYNC_KEY)===accountId; }catch(e){}
  if(kind==='claude'){ if(first.empty && hasLocalData()) await uploadAll(); }
  else if(!jaMesclado){ await mergeUp(first); try{ localStorage.setItem(SYNC_KEY, accountId); }catch(e){} }
  if(!cloud) return null;
  setMode('cloud');
  return col.onSnapshot(applySnapshot, ()=>{ cloud=null; setMode('local'); });
}
async function initCloud(){
  try{
    if(window.claude && window.claude.use){
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = user ? await user.id() : null;
      if(!db || !id){ setMode('local'); return; }
      await connectCol(db.collection('data/users/' + id), 'claude', id);
      return;
    }
    if(!window.firebase){ setMode('local'); return; } // sem internet na primeira abertura: segue só no aparelho
    firebase.initializeApp(FIREBASE);
    fbAuth = firebase.auth();
    const fs = firebase.firestore();
    try{ fs.settings({ignoreUndefinedProperties:true}); await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
    fbAuth.getRedirectResult().catch(e=>{ if(e && e.code) toast(AUTH_ERR[e.code] || 'Não foi possível entrar com o Google'); });
    fbAuth.onAuthStateChanged(async user=>{
      if(fbUnsub){ fbUnsub(); fbUnsub=null; } cloud=null;
      if(!user){ cloudKind=null; setMode('local'); render(); return; }
      try{ fbUnsub = await connectCol(fs.collection('users/' + user.uid + '/docs'), 'fb', user.uid); }
      catch(e){ cloud=null; setMode('local'); toast('Não foi possível conectar à nuvem agora'); }
      render();
    });
  }catch(e){ cloud=null; setMode('local'); }
}

async function contaAcao(acao){
  if(!fbAuth){ toast('Sem conexão com a nuvem agora'); return; }
  const email = ($('#a-email')?.value||'').trim(), senha = $('#a-senha')?.value||'';
  try{
    if(acao==='google'){
      const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
      try{ await fbAuth.signInWithPopup(prov); }
      catch(e){ // App instalado que não abre janelas: tenta pela página inteira
        if(e && ['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){ await fbAuth.signInWithRedirect(prov); return; }
        throw e; }
      toast('Conectada. Sincronizando…');
    }
    else if(acao==='entrar'){ await fbAuth.signInWithEmailAndPassword(email, senha); toast('Conectada. Sincronizando…'); }
    else if(acao==='criar'){ await fbAuth.createUserWithEmailAndPassword(email, senha); toast('Conta criada. Seus dados estão subindo para a nuvem'); }
    else if(acao==='senha'){ if(!email){ toast('Digite seu e-mail acima'); return; } await fbAuth.sendPasswordResetEmail(email); toast('Enviamos um link para redefinir a senha'); }
  }catch(e){ if(e && ['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)) return; toast(AUTH_ERR[e && e.code] || 'Não deu certo. Tente de novo.'); }
}

/* ================= Cálculos ================= */
const valorPlantao = (d, s) => d && d.plantao ? (+s.plantaoDia||0) + (Math.max(0, +d.caes||0) * (+s.plantaoCao||0)) : 0;
function calc(ym){
  const s = state.settings;
  const ex = Object.values(state.extras).filter(e=>(e.data||'').startsWith(ym));
  const days = Object.values(state.days).filter(d=>d.date.startsWith(ym));
  const nSob = days.filter(d=>d.sobreaviso).length;
  const cham = days.filter(d=>d.chamado); const nUti = cham.filter(d=>d.cti).length; const nCham = cham.length - nUti;
  const fixo = ym >= (s.inicio||'2026-09') ? +s.fixo : 0;
  const vSob = nSob * s.sobreavisoDia, vCham = nCham*s.chamado + nUti*s.chamadoUti;
  const plan = days.filter(d=>d.plantao); const nPlan = plan.length; const nCaes = plan.reduce((a,d)=>a+(+d.caes||0),0);
  const vPlan = plan.reduce((a,d)=>a+valorPlantao(d,s),0);
  const vCom = ex.reduce((a,e)=>a+(+e.comissao||0),0);
  const bruto = fixo + vSob + vCham + vPlan + vCom;
  const semReg = ex.filter(e=>!e.registrado && TIPO[e.tipo]?.id!=='anestesia').length;
  return {ex, days, nSob, nCham, nUti, nPlan, nCaes, fixo, vSob, vCham, vPlan, vCom, bruto, semReg};
}
function comissaoDe(tipo, valor){
  const t = TIPO[tipo]; const tab = state.settings.tabela[tipo];
  if(!t || t.modo==='manual') return 0; if(t.modo==='fixo') return +tab || 0;
  return Math.round((parseMoney(valor) * (+tab||0)/100)*100)/100;
}
function regraDe(tipo){ const t=TIPO[tipo]; const v=state.settings.tabela[tipo];
  if(tipo==='anestesia' || t.modo==='manual') return t.regra;
  if(t.modo==='fixo') return `${brl(v)} fixos por laudo feito por você, fora do horário de plantão.`;
  return `${String(v).replace('.',',')}% — ${t.regra.replace(/^[\d,]+%\s*[—,]\s*/,'')}`;
}
function valorLabel(tipo){ const t=TIPO[tipo]; const v=state.settings.tabela[tipo]; if(t.modo==='manual') return 'valor livre'; return t.modo==='fixo' ? (v? brl(v): 'no fixo') : `${String(v).replace('.',',')}%`; }

const pctTxt = (n,tot) => `${(n ? Math.max(0.1, Math.floor(n/tot*1000)/10) : 0).toLocaleString('pt-BR')}%`;
const pbar = (n,tot) => `<div class="pbar" aria-hidden="true"><span style="width:${tot? (n/tot*100).toFixed(2):0}%"></span></div>`;
function bStats(){
  const L = state.biblia.lidos; const hoje = todayISO();
  const porLivro = {}; let at=0, nt=0, nHoje=0, ult=null;
  for(const k in L){
    const [id,ns] = k.split(':'); const b = LIVRO[id]; const n = +ns;
    if(!b || !(n>=1 && n<=b.caps)) continue;
    porLivro[id] = (porLivro[id]||0) + 1; b.t==='at' ? at++ : nt++;
    if(L[k]===hoje) nHoje++;
    const ord = b.i*1000 + n; // último lido = data mais recente; no empate, o mais adiante na Bíblia
    if(!ult || L[k]>ult.dt || (L[k]===ult.dt && ord>ult.ord)) ult = {dt:L[k], ord, b, n};
  }
  const datas = new Set(Object.values(L)); let seq=0; const d=new Date();
  if(!datas.has(iso(d))) d.setDate(d.getDate()-1);
  while(datas.has(iso(d))){ seq++; d.setDate(d.getDate()-1); }
  // Próximo capítulo não lido depois do último marcado (volta ao início se chegar no Apocalipse)
  let prox = null;
  const seqCaps = []; LIVROS.forEach(b=>{ for(let n=1;n<=b.caps;n++) seqCaps.push([b,n]); });
  const start = ult ? seqCaps.findIndex(([b,n])=>b===ult.b && n===ult.n) + 1 : 0;
  for(let j=0;j<seqCaps.length;j++){ const [b,n] = seqCaps[(start+j)%seqCaps.length]; if(!L[capKey(b.id,n)]){ prox={b,n}; break; } }
  return {at, nt, total:at+nt, porLivro, nHoje, seq, prox};
}

      <label class="field">Por cão no plantão<input id="s-cao" data-set="plantaoCao" inputmode="decimal" value="${moneyInput(s.plantaoCao)}"></label>
    </div>
    <h2 style="font-size:15px;margin-top:4px">Comissões</h2>
    <div class="grid2">${TIPOS.filter(t=>t.id!=='anestesia' && t.modo!=='manual').map(t=>`<label class="field">${esc(t.curto)}<small>${t.modo==='fixo'?'R$ por laudo':'% do serviço'}</small><input id="s-t-${t.id}" data-tab="${t.id}" inputmode="decimal" value="${String(s.tabela[t.id]).replace('.',',')}"></label>`).join('')}</div>
  </section>
  <section class="card"><h2>Estimativa de impostos</h2><p class="intro">Opcional. Se informar a alíquota da sua PJ, o Financeiro mostra também o líquido estimado.</p>
    <label class="field">Alíquota (%)<input id="s-imp" data-set="imposto" inputmode="decimal" value="${String(s.imposto||0).replace('.',',')}"></label>
  </section>
  <section class="card"><h2>Nome</h2><label class="field">Como o app te chama<input id="s-nome" data-set="nome" value="${esc(s.nome)}"></label></section>`;
}

/* ================= Folhas (formulários) ================= */
function openSheet(html){ $('#sheet-body').innerHTML = html; $('#sheet').hidden = false; ui.armed=null; }
function closeSheet(){ $('#sheet').hidden = true; ui.sheet = null; $('#sheet-body').innerHTML=''; if(pendingRender) render(); }

function extraForm(e){
  const isNew = !e; const hoje = todayISO();
  const now = new Date(); const horaAgora = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  e = e || {id:uid(), tipo:'cardio', paciente:'', tutor:'', data: ui.sheetDate || (ymOf(hoje)===ui.ym ? hoje : `${ui.ym}-01`), hora: horaAgora, valor:'', comissao:'', obs:'', registrado:false};
  ui.sheet = {kind:'extra', isNew, id:e.id, tipo:e.tipo, comManual: !isNew && Math.abs((+e.comissao||0) - comissaoDe(e.tipo, e.valor)) > 0.004, criadoEm: e.criadoEm};
  openSheet(`
    <h2>${isNew?'Novo extra':'Editar extra'}</h2>
    <div class="tchips" role="group" aria-label="Tipo de serviço">${TIPOS.map(t=>`<button class="tchip" data-act="f-tipo" data-t="${t.id}" aria-pressed="${t.id===e.tipo}">${esc(t.curto)}<small>${esc(valorLabel(t.id))}</small></button>`).join('')}</div>
    <p class="hint" id="f-regra"></p>
    <label class="field">Paciente<input id="f-pac" value="${esc(e.paciente)}" placeholder="Nome do animal" autocomplete="off"></label>
    <label class="field">Tutor(a)<input id="f-tut" value="${esc(e.tutor)}" placeholder="Nome do tutor ou tutora" autocomplete="off"></label>
    <div class="grid2"><label class="field">Data<input type="date" id="f-data" value="${esc(e.data)}"></label><label class="field">Hora<input type="time" id="f-hora" value="${esc(e.hora)}"></label></div>
    <div id="f-plantao"></div>
    <label class="field" id="w-valor">Valor do serviço cobrado (R$)<input id="f-valor" inputmode="decimal" placeholder="0,00" value="${moneyInput(e.valor)}"></label>
    <label class="field">Sua comissão (R$)<input id="f-com" inputmode="decimal" placeholder="0,00" value="${moneyInput(e.comissao)}"><span class="calc" id="f-calc"></span></label>
    <label class="field">Observações<textarea id="f-obs" placeholder="Raça, procedimento, nº do prontuário…">${esc(e.obs)}</textarea></label>
    <label class="check"><input type="checkbox" id="f-reg" ${e.registrado?'checked':''}> Já registrei no sistema / prontuário</label>
    <div class="btnrow"><button class="btn" data-act="fechar">Cancelar</button><button class="btn primary" data-act="salvar-extra">${isNew?'Salvar extra':'Salvar'}</button></div>
    ${isNew?'':`<button class="btn danger" data-act="apagar-extra">Excluir este extra</button>`}
  `);
  syncExtraForm();
}
function syncExtraForm(fromTipo){
  const sh = ui.sheet; if(!sh || sh.kind!=='extra') return;
  const t = TIPO[sh.tipo];
  document.querySelectorAll('.tchip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===sh.tipo));
  $('#f-regra').textContent = regraDe(sh.tipo);
  $('#w-valor').hidden = t.modo!=='pct';
  const auto = comissaoDe(sh.tipo, $('#f-valor').value);
  if(fromTipo) sh.comManual = false;
  if(!sh.comManual) $('#f-com').value = moneyInput(auto);
  $('#f-calc').textContent = t.modo==='manual' ? 'Fora da tabela: digite quanto você vai receber.' : t.modo==='fixo' ? (sh.tipo==='anestesia' ? 'Incluída no honorário fixo.' : 'Valor fixo da tabela.') : `Pela tabela: ${valorLabel(sh.tipo)} de ${brl(parseMoney($('#f-valor').value))} = ${brl(auto)}`;
  const pl = emPlantao($('#f-data').value, $('#f-hora').value);
  const box = $('#f-plantao');
  if(pl && sh.tipo==='laudoecg') box.innerHTML = `<p class="hint warn">Este horário é de plantão. Se você fez o exame e o laudo, o contrato paga 35% do valor do ECG em vez dos R$ 30.<br><button class="link" data-act="f-tipo" data-t="ecgplantao">Trocar para ECG no plantão</button></p>`;
  else if(!pl && sh.tipo==='ecgplantao' && $('#f-hora').value) box.innerHTML = `<p class="hint warn">Este horário fica fora do plantão (seg–sex 19h–7h59; sáb 13h até seg 7h59). Fora dele, o laudo de ECG paga R$ 30.<br><button class="link" data-act="f-tipo" data-t="laudoecg">Trocar para Laudo de ECG</button></p>`;
  else if(sh.tipo==='sobreaviso') box.innerHTML = `<p class="hint">Lembre de marcar o dia como “Fui chamada” na Rotina para receber o adicional do chamado.</p>`;
  else box.innerHTML = '';
}
function salvarExtra(){
  const sh = ui.sheet; const t = TIPO[sh.tipo];
  const data = $('#f-data').value;
  if(!data){ toast('Informe a data do serviço'); return; }
  const e = { id: sh.id, tipo: sh.tipo, paciente: $('#f-pac').value.trim(), tutor: $('#f-tut').value.trim(), data, hora: $('#f-hora').value,
    valor: t.modo==='pct' ? parseMoney($('#f-valor').value) : 0, pct: t.modo==='pct' ? +state.settings.tabela[sh.tipo] : null,
    comissao: parseMoney($('#f-com').value), obs: $('#f-obs').value.trim(), registrado: $('#f-reg').checked,
    criadoEm: sh.criadoEm || new Date().toISOString() };
  const wasNew = sh.isNew;
  saveExtra(e); closeSheet(); if(ymOf(data)!==ui.ym){ ui.ym = ymOf(data); render(); }
  toast(wasNew ? `Extra salvo · ${brl(e.comissao)}` : 'Extra atualizado');
}

function itemForm(date, item){
  const isNew = !item;
  item = item || {id:uid(), tipo:'plantao', inicio:'19:00', fim:'', desc:''};
  ui.sheet = {kind:'item', date, isNew, id:item.id, tipo:item.tipo};
  openSheet(`
    <h2>${isNew?'Adicionar à agenda':'Editar anotação'}</h2>
    <p class="muted" style="margin:0">${esc(cap(dLong(date)))}</p>
    <div class="chips" role="group" aria-label="Tipo">${ITEM_TIPOS.map(t=>`<button class="chip" data-act="i-tipo" data-t="${t.id}" aria-pressed="${t.id===item.tipo}">${esc(t.nome)}</button>`).join('')}</div>
    <div class="grid2"><label class="field">Início<input type="time" id="i-ini" value="${esc(item.inicio)}"></label><label class="field">Fim<input type="time" id="i-fim" value="${esc(item.fim)}"></label></div>
    <label class="field">Descrição<input id="i-desc" value="${esc(item.desc)}" placeholder="Ex.: Plantão noturno, cirurgia do Thor, troca de turno…" autocomplete="off"></label>
    ${isNew && !(state.days[date]?.sobreaviso) ? `<label class="check"><input type="checkbox" id="i-sob" checked> Marcar este dia como sobreaviso na escala (se for plantão)</label>`:''}
    <div class="btnrow"><button class="btn" data-act="fechar">Cancelar</button><button class="btn primary" data-act="salvar-item">Salvar</button></div>
    ${isNew?'':`<button class="btn danger" data-act="apagar-item">Excluir</button>`}
  `);
  syncItemForm();
}
function syncItemForm(){ const sh=ui.sheet; document.querySelectorAll('[data-act="i-tipo"]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===sh.tipo));
  const sob = $('#i-sob'); if(sob){ sob.closest('label').hidden = sh.tipo!=='plantao'; } }
function salvarItem(){
  const sh = ui.sheet; const day = {...blankDay(sh.date), ...(state.days[sh.date]||{})};
  const it = {id:sh.id, tipo:sh.tipo, inicio:$('#i-ini').value, fim:$('#i-fim').value, desc:$('#i-desc').value.trim()};
  const itens = (day.itens||[]).filter(x=>x.id!==sh.id).concat([it]);
  const patch = {itens};
  const sob = $('#i-sob'); if(sob && sh.tipo==='plantao' && sob.checked) patch.sobreaviso = true;
  closeSheet(); updateDay(sh.date, patch); toast('Anotado na rotina');
}

/* ================= Backup ================= */
async function exportar(){
  const json = JSON.stringify({app:'plantao-extras', versao:1, exportadoEm:new Date().toISOString(), ...state}, null, 1);
  let dl = null; try{ dl = window.claude?.use ? await window.claude.use('downloads') : null; }catch(e){}
  if(dl){ try{ const r = await dl.save({filename:`backup-plantao-extras-${todayISO()}.json`, data:json}); if(r?.status==='saved'||r?.status==='delivered') toast('Backup salvo'); return; }catch(e){ if(e && e.code==='declined') return; } }
  if(!window.claude){ try{ const blob=new Blob([json],{type:'application/json'}); const f=new File([blob],`backup-plantao-extras-${todayISO()}.json`,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:'Backup Plantão & Extras'}); toast('Backup pronto'); return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); toast('Backup salvo em Downloads'); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  const box = $('#backup-box'); if(!box) return; box.hidden=false;
  box.innerHTML = `<p class="intro">Não foi possível baixar o arquivo aqui. Copie o texto abaixo e guarde em um lugar seguro (por exemplo, numa nota).</p><textarea id="backup-txt" readonly>${esc(json)}</textarea><button class="btn" data-act="copiar-backup">Copiar backup</button>`;
}
function importarArquivo(file){
  const r = new FileReader();
  r.onload = async () => {
    try{ const o = JSON.parse(r.result); if(!o || (!o.extras && !o.days && !o.biblia)) throw 0;
      if(o.settings) state.settings = normSettings(o.settings);
      state.biblia = {lidos: {...state.biblia.lidos, ...normBiblia(o.biblia).lidos}};
      Object.values(o.extras||{}).forEach(e=>{ if(e.id) state.extras[e.id]=e; });
      Object.values(o.days||{}).forEach(d=>{ if(!d.date) return; const cur = state.days[d.date];
        if(!cur){ state.days[d.date] = {...blankDay(d.date), ...d}; return; }
        const itens = [...(cur.itens||[])]; (d.itens||[]).forEach(it=>{ const i = itens.findIndex(x=>x.id===it.id); i>=0 ? itens[i]=it : itens.push(it); });
        state.days[d.date] = {...blankDay(d.date), ...cur, ...d, sobreaviso: !!(cur.sobreaviso||d.sobreaviso), chamado: !!(cur.chamado||d.chamado), cti: !!(cur.cti||d.cti), plantao: !!(cur.plantao||d.plantao), caes: Math.max(+cur.caes||0, +d.caes||0), notas: d.notas || cur.notas || '', itens}; });
      saveLocal(); render(); await uploadAll(); toast('Backup restaurado');
    }catch(e){ toast('Arquivo inválido: escolha um backup salvo por este app'); }
  };
  r.readAsText(file);
}

/* ================= Eventos ================= */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2600); }

document.addEventListener('click', ev=>{
  const a = ev.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act!=='apagar-extra' && act!=='apagar-item' && act!=='b-limpar' && ui.armed){ ui.armed=null; document.querySelectorAll('.btn.danger.armed').forEach(b=>{b.classList.remove('armed'); b.textContent = b.dataset.label || b.textContent;}); }
  switch(act){
    case 'view': if(a.dataset.v==='biblia' && ui.view==='biblia') ui.livro = null; ui.view = a.dataset.v; window.scrollTo(0,0); render(); break;
    case 'b-tab': ui.btab = a.dataset.t; render(); break;
    case 'b-livro': ui.livro = a.dataset.id; ui.btab = LIVRO[a.dataset.id].t; window.scrollTo(0,0); render(); break;
    case 'b-livros': ui.livro = null; window.scrollTo(0,0); render(); break;
    case 'b-cap': case 'b-prox': {
      const b = LIVRO[a.dataset.id]; const k = capKey(b.id, a.dataset.n); const lidos = {...state.biblia.lidos};
      if(lidos[k] && act==='b-cap'){ delete lidos[k]; saveLidos(lidos); toast(`${b.nome} ${a.dataset.n} desmarcado`); break; }
      lidos[k] = todayISO(); saveLidos(lidos);
      const n = Object.keys(lidos).filter(x=>x.startsWith(b.id+':')).length;
      toast(n===b.caps ? `${b.nome} concluído!` : `${b.nome} ${a.dataset.n} lido`);
      break; }
    case 'b-todos': { const b = LIVRO[a.dataset.id]; const lidos = {...state.biblia.lidos}; const hoje = todayISO();
      for(let c=1;c<=b.caps;c++){ const k=capKey(b.id,c); if(!lidos[k]) lidos[k]=hoje; }
      saveLidos(lidos); toast(`${b.nome} concluído!`); break; }
    case 'b-limpar':
      if(ui.armed!=='biblia'){ ui.armed='biblia'; a.dataset.label=a.textContent; a.classList.add('armed'); a.textContent='Toque de novo para desmarcar'; }
      else { const b = LIVRO[a.dataset.id]; const lidos = {...state.biblia.lidos}; for(let c=1;c<=b.caps;c++) delete lidos[capKey(b.id,c)]; ui.armed=null; saveLidos(lidos); toast(`${b.nome} desmarcado`); }
      break;
    case 'mes': ui.ym = ymShift(ui.ym, +a.dataset.d); render(); break;
    case 'novo-extra': ui.sheetDate = a.dataset.d || null; extraForm(null); break;
    case 'edit-extra': { const e = state.extras[a.dataset.id]; if(e) extraForm(e); break; }
    case 'toggle-reg': { ev.stopPropagation(); const e = state.extras[a.dataset.id]; if(e){ saveExtra({...e, registrado:!e.registrado}); } break; }
    case 'f-tipo': ui.sheet.tipo = a.dataset.t; syncExtraForm(true); break;
    case 'salvar-extra': salvarExtra(); break;
    case 'apagar-extra':
      if(ui.armed!=='extra'){ ui.armed='extra'; a.dataset.label=a.textContent; a.classList.add('armed'); a.textContent='Toque de novo para excluir'; }
      else { const id=ui.sheet.id; closeSheet(); deleteExtra(id); toast('Extra excluído'); }
      break;
    case 'fechar': closeSheet(); break;
    case 'ver-semreg': ui.view='extras'; ui.filtro='semreg'; render(); break;
    case 'filtro': ui.filtro = a.dataset.f; document.querySelectorAll('[data-act="filtro"]').forEach(b=>b.setAttribute('aria-pressed', b===a)); renderExtrasList(); break;
    case 'ir-dia': ui.selDay = a.dataset.d; ui.ym = ymOf(a.dataset.d); ui.view='rotina'; window.scrollTo(0,0); render(); break;
    case 'sel-day': ui.selDay = a.dataset.d; render(); break;
    case 'caes': { const d = state.days[ui.selDay]; if(d && d.plantao) updateDay(ui.selDay, {caes: Math.max(0, (+d.caes||0) + (+a.dataset.d))}); break; }
    case 'novo-item': itemForm(ui.selDay, null); break;
    case 'edit-item': { const d=state.days[a.dataset.d]; const it=(d?.itens||[]).find(x=>x.id===a.dataset.i); if(it) itemForm(a.dataset.d, it); break; }
    case 'i-tipo': ui.sheet.tipo = a.dataset.t; syncItemForm(); break;
    case 'salvar-item': salvarItem(); break;
    case 'apagar-item':
      if(ui.armed!=='item'){ ui.armed='item'; a.dataset.label=a.textContent; a.classList.add('armed'); a.textContent='Toque de novo para excluir'; }
      else { const sh=ui.sheet; const d=state.days[sh.date]; closeSheet(); updateDay(sh.date, {itens:(d?.itens||[]).filter(x=>x.id!==sh.id)}); toast('Anotação excluída'); }
      break;
    case 'ctab': ui.ctab = a.dataset.t; render(); break;
    case 'exportar': exportar(); break;
    case 'conta-google': contaAcao('google'); break;
    case 'conta-entrar': contaAcao('entrar'); break;
    case 'conta-criar': contaAcao('criar'); break;
    case 'conta-senha': contaAcao('senha'); break;
    case 'sair-conta': if(fbAuth) fbAuth.signOut().then(()=>toast('Você saiu da conta. Os dados continuam neste aparelho')); break;
    case 'importar': $('#import-file').click(); break;
    case 'copiar-backup': { const t=$('#backup-txt'); const ok=()=>toast('Backup copiado');
      if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(t.value).then(ok, ()=>{ t.select(); toast('Texto selecionado: copie manualmente'); }); } else { t.select(); toast('Texto selecionado: copie manualmente'); } break; }
  }
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape' && !$('#sheet').hidden) closeSheet();
  if((ev.key==='Enter'||ev.key===' ') && ev.target.matches('article[data-act]')){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('input', ev=>{
  const id = ev.target.id;
  if(id==='f-valor' || id==='f-data' || id==='f-hora') syncExtraForm();
  else if(id==='f-com'){ if(ui.sheet) ui.sheet.comManual = true; }
  else if(id==='busca'){ ui.busca = ev.target.value; renderExtrasList(); }
});
document.addEventListener('change', ev=>{
  const el = ev.target; const id = el.id;
  if(id==='t-sob') updateDay(ui.selDay, {sobreaviso: el.checked});
  else if(id==='t-cham') updateDay(ui.selDay, {chamado: el.checked});
  else if(id==='t-cti') updateDay(ui.selDay, {cti: el.checked});
  else if(id==='t-plan') updateDay(ui.selDay, {plantao: el.checked});
  else if(id==='day-notas'){ const v=el.value; el.blur(); updateDay(ui.selDay, {notas: v}); }
  else if(el.dataset.set){ const k=el.dataset.set; const v = k==='nome' ? el.value.trim()||'Sara' : parseMoney(el.value); saveSettings({[k]: v}); }
  else if(el.dataset.tab){ saveSettings({tabela:{...state.settings.tabela, [el.dataset.tab]: parseMoney(el.value)}}); }
  else if(id==='import-file' && el.files[0]){ importarArquivo(el.files[0]); el.value=''; }
});
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(pendingRender && !typingInMain()) render(); }, 0); });

/* ================= Início ================= */
loadLocal();
render();
setMode('connecting');
initCloud();
if(!window.claude){
  if('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
}
</script>
